<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Azules - Hyper-Smooth 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010105;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
        }
        header {
            text-align: center;
            pointer-events: auto;
            background: rgba(2, 4, 15, 0.6);
            padding: 12px 30px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 225, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.25);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #e0f7ff;
            text-shadow: 0 0 15px rgba(0, 225, 255, 0.9);
        }
        p.instructions {
            font-size: 0.8rem;
            color: #8be0ff;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .controls-bar {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            background: rgba(8, 12, 28, 0.75);
            padding: 10px 24px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        button.btn {
            background: linear-gradient(135deg, #0066ff, #00d4ff);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.4);
        }
        button.btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 20px rgba(0, 220, 255, 0.8);
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 12, 0.7);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
        .love-card {
            background: linear-gradient(145deg, #ffffff, #edf7ff);
            color: #0d1b2a;
            width: 320px;
            padding: 32px 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 180, 255, 0.35);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0, 180, 255, 0.3);
        }
        .modal-backdrop.active .love-card {
            transform: scale(1) translateY(0);
        }
        .love-card h2 {
            font-size: 1.6rem;
            color: #0066ff;
            margin-bottom: 14px;
            letter-spacing: 3px;
        }
        .love-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2b3a4a;
            margin-bottom: 22px;
        }
        .close-btn {
            background: linear-gradient(135deg, #0066ff, #00c3ff);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }
    </style>

    <!-- Three.js + Postprocessing Bloom Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header>
            <h1>Blue Galaxy of Love</h1>
            <p class="instructions">Orbit with drag • Scroll to zoom • Click glowing roses to view letters</p>
        </header>

        <div class="controls-bar">
            <button class="btn" id="reset-cam">Reset View</button>
            <button class="btn" id="toggle-spin">Toggle Spin</button>
        </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop">
        <div class="love-card">
            <h2 id="card-title">MY LOVE</h2>
            <p id="card-text">You are my universe, my guiding star, and the most beautiful part of my everyday life.</p>
            <button class="close-btn" id="close-modal">Close</button>
        </div>
    </div>

    <script>
        // High Quality Soft Glow Radial Alpha Map Texture
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            gradient.addColorStop(0.15, 'rgba(200, 245, 255, 0.85)');
            gradient.addColorStop(0.4, 'rgba(0, 160, 255, 0.35)');
            gradient.addColorStop(0.7, 'rgba(0, 60, 200, 0.08)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(64, 64, 64, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010105, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 45, 140);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- UnrealBloom Post-Processing Pass ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.6, // bloom strength
            0.4, // radius
            0.15 // threshold
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x0a1838, 2.5);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0x00d4ff, 5, 350);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        // --- Particle Spiral Galaxy ---
        const glowTexture = createGlowTexture();
        const particleCount = 45000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorCore = new THREE.Color(0xffffff);
        const colorInner = new THREE.Color(0x80f0ff);
        const colorOuter = new THREE.Color(0x0044ff);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.pow(Math.random(), 1.2) * 230;
            const spinAngle = radius * 0.038;
            const branchAngle = ((i % 4) * Math.PI * 2) / 4;

            const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 14;
            const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 14;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 14;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixedColor = radius < 30 ? 
                colorCore.clone().lerp(colorInner, radius / 30) : 
                colorInner.clone().lerp(colorOuter, (radius - 30) / 200);

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 2.2,
            map: glowTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexColors: true,
            opacity: 0.85
        });

        const galaxyParticles = new THREE.Points(geometry, particleMaterial);
        scene.add(galaxyParticles);

        // --- Volumetric Nebula Cloud Layer ---
        const cloudGroup = new THREE.Group();
        for (let i = 0; i < 20; i++) {
            const cloudGeo = new THREE.PlaneGeometry(80, 80);
            const cloudMat = new THREE.MeshBasicMaterial({
                map: glowTexture,
                transparent: true,
                opacity: 0.08,
                blending: THREE.AdditiveBlending,
                color: 0x0088ff,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 140;
            cloud.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 20, Math.sin(angle) * dist);
            cloud.rotation.x = Math.PI / 2;
            cloud.rotation.z = Math.random() * Math.PI;
            cloudGroup.add(cloud);
        }
        scene.add(cloudGroup);

        // --- Central Heart Core ---
        const heartShape = new THREE.Shape();
        heartShape.fromPoints([
            new THREE.Vector2(0, 3),
            new THREE.Vector2(2, 5),
            new THREE.Vector2(4, 3),
            new THREE.Vector2(4, 0),
            new THREE.Vector2(0, -4),
            new THREE.Vector2(-4, 0),
            new THREE.Vector2(-4, 3),
            new THREE.Vector2(-2, 5),
            new THREE.Vector2(0, 3)
        ]);

        const extrudeSettings = { depth: 1.2, bevelEnabled: true, bevelSegments: 6, steps: 2, bevelSize: 0.8, bevelThickness: 0.8 };
        const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeo.center();

        const heartMat = new THREE.MeshStandardMaterial({
            color: 0x00e1ff,
            emissive: 0x0088ff,
            emissiveIntensity: 1.2,
            roughness: 0.1,
            metalness: 0.1
        });
        const centralHeart = new THREE.Mesh(heartGeo, heartMat);
        centralHeart.scale.set(3.2, 3.2, 3.2);
        scene.add(centralHeart);

        // --- Procedural 3D Blue Rose Geometry Function ---
        function create3DRose() {
            const roseGroup = new THREE.Group();
            const petalMat = new THREE.MeshStandardMaterial({
                color: 0x00c8ff,
                emissive: 0x0044ff,
                emissiveIntensity: 0.8,
                roughness: 0.2,
                side: THREE.DoubleSide
            });

            // Core sphere
            const coreGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const coreMesh = new THREE.Mesh(coreGeo, petalMat);
            roseGroup.add(coreMesh);

            // Layered Petals
            for (let layer = 0; layer < 3; layer++) {
                const count = 4 + layer * 2;
                const radius = 1.2 + layer * 0.8;
                for (let p = 0; p < count; p++) {
                    const angle = (p / count) * Math.PI * 2 + (layer * 0.5);
                    const petalGeo = new THREE.CircleGeometry(1.2 + layer * 0.3, 12);
                    const petal = new THREE.Mesh(petalGeo, petalMat);
                    petal.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 0.4, Math.sin(angle) * radius);
                    petal.rotation.x = Math.PI / 3;
                    petal.rotation.y = -angle;
                    roseGroup.add(petal);
                }
            }

            // Outer Orbit Glow Ring
            const ringGeo = new THREE.RingGeometry(4.5, 5.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            roseGroup.add(ring);

            return roseGroup;
        }

        // --- Floating Blue Roses & Messages ---
        const interactiveGroup = new THREE.Group();
        scene.add(interactiveGroup);

        const messages = [
            { title: "MY LOVE", text: "You are the light that guides me through every single day." },
            { title: "FOREVER", text: "Every moment spent with you feels like a dream come true." },
            { title: "MY EVERYTHING", text: "Your smile brightens up my whole universe." },
            { title: "YOU & ME", text: "Pasig or anywhere across the map, my heart stays with you." },
            { title: "SO BEAUTIFUL", text: "You are my precious treasure and my greatest blessing." }
        ];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickableObjects = [];

        messages.forEach((msg, index) => {
            const angle = (index / messages.length) * Math.PI * 2;
            const distance = 60 + Math.random() * 30;
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            const y = (Math.random() - 0.5) * 25;

            const roseNode = create3DRose();
            roseNode.position.set(x, y, z);
            roseNode.userData = { title: msg.title, text: msg.text };

            interactiveGroup.add(roseNode);
            
            // Add bounding sphere for click detection
            const clickProxyGeo = new THREE.SphereGeometry(4.5, 8, 8);
            const clickProxyMat = new THREE.MeshBasicMaterial({ visible: false });
            const clickProxy = new THREE.Mesh(clickProxyGeo, clickProxyMat);
            clickProxy.userData = { parentNode: roseNode };
            roseNode.add(clickProxy);

            clickableObjects.push(clickProxy);
        });

        // Click Handler & UI
        let isSpinning = true;

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const nodeData = intersects[0].object.userData.parentNode.userData;
                showModal(nodeData.title, nodeData.text);
                controls.target.copy(intersects[0].object.userData.parentNode.position);
            }
        });

        const modalBackdrop = document.getElementById('modal-backdrop');
        const cardTitle = document.getElementById('card-title');
        const cardText = document.getElementById('card-text');
        const closeModal = document.getElementById('close-modal');

        function showModal(title, text) {
            cardTitle.innerText = title;
            cardText.innerText = text;
            modalBackdrop.classList.add('active');
        }

        closeModal.addEventListener('click', () => {
            modalBackdrop.classList.remove('active');
        });

        document.getElementById('reset-cam').addEventListener('click', () => {
            camera.position.set(0, 45, 140);
            controls.target.set(0, 0, 0);
        });

        document.getElementById('toggle-spin').addEventListener('click', () => {
            isSpinning = !isSpinning;
        });

        // Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (isSpinning) {
                galaxyParticles.rotation.y = elapsedTime * 0.04;
                interactiveGroup.rotation.y = elapsedTime * 0.04;
                cloudGroup.rotation.y = elapsedTime * 0.02;
            }

            centralHeart.rotation.y = elapsedTime * 0.5;
            centralHeart.position.y = Math.sin(elapsedTime * 2) * 2.5;

            // Rotate rose nodes
            interactiveGroup.children.forEach(rose => {
                rose.rotation.y = elapsedTime * 0.8;
            });

            controls.update();
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
